<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Error · EvidenceEngine{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..900;1,8..60,300..900&family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="h-full bg-paper-50 text-ink-800 font-sans antialiased">
  <header class="h-14 border-b border-ink-200 bg-paper-50 flex items-center px-8">
    <a href="/dashboard/" class="font-serif font-semibold text-ink-900 text-base hover:text-accent-700 transition-colors">EvidenceEngine</a>
  </header>
  <main class="max-w-2xl mx-auto px-8 py-24">
    <div class="text-xs font-mono text-ink-400 tracking-wider uppercase mb-4">{% block code %}Error{% endblock %}</div>
    <h1 class="font-serif text-4xl font-semibold text-ink-900 leading-tight">{% block heading %}Something went wrong{% endblock %}</h1>
    <p class="mt-4 text-ink-500 text-base leading-relaxed">{% block body %}{% endblock %}</p>
    {% if detail %}
    <pre class="mt-6 text-xs font-mono text-ink-400 bg-paper-100 border border-ink-100 rounded-sm px-4 py-3 overflow-x-auto">{{ detail }}</pre>
    {% endif %}
    <div class="mt-10">
      <a href="/dashboard/" class="inline-flex items-center gap-2 text-sm font-medium text-accent-700 hover:text-accent-800 transition-colors">
        ← Back to runs
      </a>
    </div>
  </main>
</body>
</html>
