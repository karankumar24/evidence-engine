<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EvidenceEngine — Verifying…</title>
  <link rel="stylesheet" href="/static/css/fonts.css?v=0.1.1">
  <link rel="stylesheet" href="/static/css/app.css?v=0.1.1">
  <script src="/static/vendor/htmx.min.js"></script>
</head>
<body class="bg-paper-50 text-ink-800 font-sans antialiased min-h-full">

  <!-- Header -->
  <header class="h-14 border-b border-ink-200 bg-paper-50 flex items-center px-8">
    <a href="/dashboard" class="font-serif font-semibold text-ink-900 text-base hover:text-accent-700 transition-colors">EvidenceEngine</a>
    <span class="ml-3 text-ink-400 text-xs font-mono">/ verification in progress</span>
  </header>

  <main class="max-w-lg mx-auto px-8 py-16 text-center">

    <!-- Hero (spinner + title + subtitle) lives INSIDE the HTMX-swapped partial
         so it disappears immediately on transition to completed/failed —
         otherwise the spinner+"Verifying your document" stays visible alongside
         the failure card, sending mixed signals (audit 2026-04-20). -->
    {% include "partials/run_status_body.html" %}

    <!-- Run metadata -->
    <div class="mt-8 text-xs font-mono text-ink-400 space-y-1">
      <div>Run: {{ run.id }}</div>
      {% if run.started_at %}
        <div>Started: {{ run.started_at.strftime('%Y-%m-%d %H:%M:%S') }} UTC</div>
      {% endif %}
    </div>

    <div class="mt-6">
      <a href="/dashboard" class="text-sm text-ink-400 hover:text-ink-700 transition-colors">← Back to dashboard</a>
    </div>

  </main>

</body>
</html>
