{% import "components/_kbd.html" as kbd %}

<div id="keyboard-help"
     hidden
     role="dialog"
     aria-modal="true"
     aria-labelledby="kbd-help-title"
     data-keyboard-help-backdrop
     class="fixed inset-0 z-40 flex items-center justify-center bg-ink-900/40 px-4">
  <div class="bg-paper-50 border border-ink-200 rounded-sm shadow-lg max-w-md w-full p-6"
       data-keyboard-help-panel>
    <div class="flex items-start justify-between mb-4">
      <div>
        <div class="text-xs font-mono text-ink-400 tracking-wider uppercase">Shortcuts</div>
        <h2 id="kbd-help-title" class="font-serif text-xl font-semibold text-ink-900 mt-1">Keyboard controls</h2>
      </div>
      <button type="button"
              data-keyboard-help-close
              class="text-ink-400 hover:text-ink-700 text-lg leading-none px-2"
              aria-label="Close">×</button>
    </div>
    <dl class="space-y-2.5 text-sm">
      <div class="flex items-center justify-between">
        <dt class="text-ink-700">Approve claim</dt>
        <dd>{{ kbd.kbd("A") }}</dd>
      </div>
      <div class="flex items-center justify-between">
        <dt class="text-ink-700">Reject claim</dt>
        <dd>{{ kbd.kbd("R") }}</dd>
      </div>
      <div class="flex items-center justify-between">
        <dt class="text-ink-700">Mark Insufficient</dt>
        <dd>{{ kbd.kbd("F") }}</dd>
      </div>
      <div class="flex items-center justify-between">
        <dt class="text-ink-700">Next claim</dt>
        <dd>{{ kbd.kbd("J") }}</dd>
      </div>
      <div class="flex items-center justify-between">
        <dt class="text-ink-700">Previous claim</dt>
        <dd>{{ kbd.kbd("K") }}</dd>
      </div>
      <div class="flex items-center justify-between pt-2 border-t border-ink-100 mt-2">
        <dt class="text-ink-500">Show this help</dt>
        <dd>{{ kbd.kbd("?") }}</dd>
      </div>
      <div class="flex items-center justify-between">
        <dt class="text-ink-500">Close</dt>
        <dd>{{ kbd.kbd("Esc") }}</dd>
      </div>
    </dl>
  </div>
</div>
