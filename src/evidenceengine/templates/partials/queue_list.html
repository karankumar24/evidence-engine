{% import "components/_badge.html" as badge %}

<!-- Filter bar -->
<div id="queue-filters" class="p-3 border-b border-ink-100 bg-paper-50 space-y-2">
  <label for="filter-verdict" class="sr-only">Filter by verdict</label>
  <select id="filter-verdict" name="verdict_filter"
          class="w-full text-xs border border-ink-200 rounded-sm px-2.5 py-1.5 bg-white text-ink-700
                 focus:outline-none focus:ring-2 focus:ring-accent-300 focus:border-accent-700
                 font-sans appearance-none"
          hx-get="/dashboard/{{ packet.id }}/{{ run.id }}/queue"
          hx-target="#queue-list"
          hx-swap="innerHTML"
          hx-trigger="change"
          hx-include="[name='verdict_filter'],[name='confidence'],[name='source_doc_id']">
    <option value="" {% if not active_filters.verdict_filter %}selected{% endif %}>All verdicts</option>
    <option value="contradicted" {% if active_filters.verdict_filter == 'contradicted' %}selected{% endif %}>Contradicted</option>
    <option value="needs_review" {% if active_filters.verdict_filter == 'needs_review' %}selected{% endif %}>Needs Review</option>
    <option value="insufficient_support" {% if active_filters.verdict_filter == 'insufficient_support' %}selected{% endif %}>Insufficient Support</option>
    <option value="supported" {% if active_filters.verdict_filter == 'supported' %}selected{% endif %}>Supported</option>
  </select>

  <label for="filter-confidence" class="sr-only">Filter by confidence</label>
  <select id="filter-confidence" name="confidence"
          class="w-full text-xs border border-ink-200 rounded-sm px-2.5 py-1.5 bg-white text-ink-700
                 focus:outline-none focus:ring-2 focus:ring-accent-300 focus:border-accent-700
                 font-sans appearance-none"
          hx-get="/dashboard/{{ packet.id }}/{{ run.id }}/queue"
          hx-target="#queue-list"
          hx-swap="innerHTML"
          hx-trigger="change"
          hx-include="[name='verdict_filter'],[name='confidence'],[name='source_doc_id']">
    <option value="" {% if not active_filters.confidence %}selected{% endif %}>All confidence</option>
    <option value="high" {% if active_filters.confidence == 'high' %}selected{% endif %}>High (&ge;80%)</option>
    <option value="medium" {% if active_filters.confidence == 'medium' %}selected{% endif %}>Medium (50–80%)</option>
    <option value="low" {% if active_filters.confidence == 'low' %}selected{% endif %}>Low (&lt;50%)</option>
  </select>

  {% if source_docs %}
    <label for="filter-source" class="sr-only">Filter by source document</label>
    <select id="filter-source" name="source_doc_id"
            class="w-full text-xs border border-ink-200 rounded-sm px-2.5 py-1.5 bg-white text-ink-700
                   focus:outline-none focus:ring-2 focus:ring-accent-300 focus:border-accent-700
                   font-sans appearance-none"
            hx-get="/dashboard/{{ packet.id }}/{{ run.id }}/queue"
            hx-target="#queue-list"
            hx-swap="innerHTML"
            hx-trigger="change"
            hx-include="[name='verdict_filter'],[name='confidence'],[name='source_doc_id']">
      <option value="" {% if not active_filters.source_doc_id %}selected{% endif %}>All sources</option>
      {% for doc in source_docs %}
        <option value="{{ doc.id }}" {% if active_filters.source_doc_id == doc.id | string %}selected{% endif %}>{{ doc.filename }}</option>
      {% endfor %}
    </select>
  {% else %}
    <input type="hidden" name="source_doc_id" value="">
  {% endif %}
</div>

<!-- Claim queue -->
<div id="queue-list">
  {% include "partials/_queue_items.html" %}
</div>
