{% macro collapsible(title, default_open=True, id=None) %}
  {%- set panel_id = (id ~ "-panel") if id else None -%}
  {%- set btn_id   = (id ~ "-btn")   if id else None -%}
  <section data-component="collapsible"
           {% if id %}id="{{ id }}"{% endif %}
           x-data="{open: {{ 'true' if default_open else 'false' }}}"
           class="border border-ink-100 rounded-md overflow-hidden bg-paper-50">
    <button type="button"
            {% if btn_id %}id="{{ btn_id }}"{% endif %}
            data-collapsible-toggle
            @click="open = !open"
            :aria-expanded="open ? 'true' : 'false'"
            {% if panel_id %}aria-controls="{{ panel_id }}"{% endif %}
            class="w-full flex items-center justify-between px-4 py-3 bg-paper-100
                   hover:bg-paper-200 text-sm font-medium text-ink-800 text-left
                   font-serif">
      <span>{{ title }}</span>
      <span data-collapsible-chevron
            aria-hidden="true"
            x-text="open ? '\u25B4' : '\u25BE'"
            class="text-xs text-ink-400"></span>
    </button>
    <div data-collapsible-body
         {% if panel_id %}id="{{ panel_id }}"{% endif %}
         {% if btn_id %}aria-labelledby="{{ btn_id }}"{% endif %}
         role="region"
         x-show="open"
         class="px-4 py-3">
      {{ caller() }}
    </div>
  </section>
{% endmacro %}
