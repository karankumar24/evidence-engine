<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EvidenceEngine{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/fonts.css?v=0.1.0">
  <link rel="stylesheet" href="/static/css/app.css?v=0.1.0">
  <script src="/static/vendor/htmx.min.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body class="h-full flex flex-col bg-paper-50 text-ink-800 font-sans antialiased"
      x-data="reviewKeyboard"
      @keydown.window.a.prevent="approve()"
      @keydown.window.r.prevent="reject()"
      @keydown.window.f.prevent="flag()"
      @keydown.window.j.prevent="nextClaim()"
      @keydown.window.k.prevent="prevClaim()"
      @keydown.window.shift.slash.prevent="helpOpen = true"
      @keydown.window.escape="helpOpen = false">

  <a href="#detail-panel"
     class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50
            focus:px-4 focus:py-2 focus:bg-paper-50 focus:text-ink-900
            focus:border focus:border-ink-200 focus:rounded-sm focus:shadow-md">
    Skip to claim detail
  </a>

  <!-- Top bar -->
  <header class="h-14 flex-shrink-0 border-b border-ink-200 bg-paper-50 z-10 flex items-center px-6 gap-6">
    {% block topbar %}{% endblock %}
  </header>

  <!-- Main content zone -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Left sidebar queue -->
    <aside class="w-[360px] flex-shrink-0 border-r border-ink-200 overflow-y-auto flex flex-col bg-paper-100">
      {% block sidebar %}{% endblock %}
    </aside>

    <!-- Right detail panel -->
    <main id="detail-panel" class="flex-1 overflow-y-auto p-8 bg-white"
          hx-on:htmx:after-swap="Alpine.initTree(this)">
      {% block detail %}
        <div class="flex h-full items-center justify-center text-ink-400 text-sm font-serif">
          Select a claim to review
        </div>
      {% endblock %}
    </main>
  </div>

  {% include "partials/_keyboard_help.html" %}
  {% include "partials/_htmx_toast.html" %}

  {% block scripts %}{% endblock %}
</body>
</html>
