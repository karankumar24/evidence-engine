<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EvidenceEngine{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/htmx.org@2/dist/htmx.min.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body class="h-full flex flex-col bg-white text-slate-900 font-sans antialiased"
      x-data="reviewKeyboard()"
      @keydown.window.a.prevent="approve()"
      @keydown.window.r.prevent="reject()"
      @keydown.window.f.prevent="flag()"
      @keydown.window.j.prevent="nextClaim()"
      @keydown.window.k.prevent="prevClaim()">

  <!-- Top bar -->
  <header class="h-14 flex-shrink-0 border-b border-slate-200 bg-white z-10 flex items-center px-6 gap-6">
    {% block topbar %}{% endblock %}
  </header>

  <!-- Main content zone -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Left sidebar queue -->
    <aside class="w-[350px] flex-shrink-0 border-r border-slate-200 overflow-y-auto flex flex-col bg-slate-50">
      {% block sidebar %}{% endblock %}
    </aside>

    <!-- Right detail panel -->
    <main id="detail-panel" class="flex-1 overflow-y-auto p-6 bg-white"
          hx-on:htmx:after-swap="Alpine.initTree(this)">
      {% block detail %}
        <div class="flex h-full items-center justify-center text-slate-400 text-sm">
          Select a claim to review
        </div>
      {% endblock %}
    </main>
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
