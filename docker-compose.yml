services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: evidenceengine
      POSTGRES_USER: evidenceengine
      POSTGRES_PASSWORD: evidenceengine_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidenceengine -d evidenceengine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
