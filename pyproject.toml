[project]
name = "evidenceengine"
version = "0.1.0"
description = "EvidenceEngine — provenance-aware document verification system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.2",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.12",
    "openai>=1.30.0",
    "python-json-logger>=2.0.0",
    "bm25s>=0.2.0",
    "sentence-transformers>=3.0.0",
    "nltk>=3.8.0",
    "jinja2>=3.1.6",
    "datasets>=4.8.4",
    "matplotlib>=3.10.8",
]

[project.optional-dependencies]
core = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.uv]
# sentence-transformers pulls in torch; on Linux the default wheels bundle
# ~2GB of CUDA/NVIDIA libraries useless on Fly's CPU-only machines, so we
# force the CPU-only wheel there. On macOS the default PyPI wheel is already
# CPU-only (no CUDA on Apple Silicon), and the PyTorch CPU index doesn't
# ship Mac wheels — so the override and sources redirect apply on Linux
# only. Without this marker, `uv pip install` fails on macOS with
# "torch==2.8.0+cpu not available on this platform".
override-dependencies = [
    "torch==2.8.0+cpu ; sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
# `live` marks tests that hit real LLM endpoints — require GEMINI_API_KEY and
# network. Default pytest runs exclude them; invoke explicitly with `-m live`.
markers = [
    "live: hits real LLM endpoints; requires GEMINI_API_KEY and network; skipped by default",
]
addopts = "-m 'not live'"
