name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest + ruff + mypy
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evidenceengine
          POSTGRES_PASSWORD: evidenceengine_dev
          POSTGRES_DB: evidenceengine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]" 2>/dev/null || uv pip install --system -e . && uv pip install --system pytest pytest-asyncio httpx ruff mypy

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://evidenceengine:evidenceengine_dev@localhost:5432/evidenceengine
        run: alembic upgrade head

      - name: ruff lint
        run: ruff check src/ tests/

      - name: mypy type check
        run: mypy src/evidenceengine --ignore-missing-imports --no-error-summary

      - name: pytest
        env:
          DATABASE_URL: postgresql+asyncpg://evidenceengine:evidenceengine_dev@localhost:5432/evidenceengine
          LLM_API_KEY: test-key
        run: pytest -q --tb=short
