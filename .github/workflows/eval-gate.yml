name: Eval Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval-gate:
    name: Run evaluation quality gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evidenceengine
          POSTGRES_PASSWORD: evidenceengine_dev
          POSTGRES_DB: evidenceengine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://evidenceengine:evidenceengine_dev@localhost:5432/evidenceengine
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVAL_FALSE_SUPPORT_THRESHOLD: "0.10"
      EVAL_CONCURRENCY: "3"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run eval quality gate
        run: uv run python eval/ci_gate.py
        # Exits non-zero if false_support_rate > EVAL_FALSE_SUPPORT_THRESHOLD
        # Workflow fails automatically — gate is enforced, not advisory (EVAL-04)
