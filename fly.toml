# Fly.io deployment config for EvidenceEngine.
#
# First-time deploy:  see DEPLOY.md for the full runbook.
#
# App name is set by `fly launch` / `fly apps create`; override with
# `fly deploy -a <name>` if you want a different name than the default.

app = "evidenceengine"
primary_region = "sjc"   # San Jose — closest to the default user; change if needed

[build]
  dockerfile = "Dockerfile"

# Runs once after every successful build, before the new version takes traffic.
# Alembic env.py reads DATABASE_URL from env, so migrations work in-container.
[deploy]
  release_command = "alembic upgrade head"

[env]
  UPLOAD_DIR         = "/data/uploads"
  INDEX_DIR          = "/data/indexes"
  PYTHONPATH         = "/app/src"
  HF_HOME            = "/data/huggingface"
  TRANSFORMERS_CACHE = "/data/huggingface"
  # Cap BLAS thread pools to 1 on shared-cpu-2x. Without these caps OpenMP /
  # MKL spawn N threads per request and oversubscribe the 2 cores under
  # concurrent load → 10x retrieval-stage variance (92s vs 1068s on identical
  # workload, 2026-04-30). Codex root-cause review recommendation.
  OMP_NUM_THREADS        = "1"
  MKL_NUM_THREADS        = "1"
  OPENBLAS_NUM_THREADS   = "1"
  TOKENIZERS_PARALLELISM = "false"

[http_service]
  internal_port = 8000
  force_https = true
  # Was scale-to-zero (auto_stop_machines="stop", min_machines_running=0).
  # That killed in-flight 5-15min pipelines mid-run; ~30% of prod failures
  # were "ServerRestart: pipeline was interrupted by server shutdown" (2026-04-20).
  # min=1 keeps one machine always-on; suspend mode keeps it cheap when idle.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  kill_timeout = "900s"             # let in-flight pipelines finish on deploy
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout  = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

# Persistent storage for uploaded PDFs + BM25 indexes. Without this, every
# machine restart wipes user data.
[mounts]
  source      = "ee_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"          # bge-reranker-v2-m3 = 2.27GB on disk; needs 4GB to mmap + DeBERTa + app
